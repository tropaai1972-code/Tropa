<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102f59"><title>ТРОПА — сообщество</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f1fa;background:#07182c}*{box-sizing:border-box}body{margin:0;padding:0 0 85px}header{padding:25px 20px;background:linear-gradient(135deg,#102f59,#07182c)}h1{font-size:29px;letter-spacing:.18em;margin:0}header p{opacity:.7;font-size:13px}.tag{display:inline-block;font-size:11px;border:1px solid #6586aa;border-radius:99px;padding:5px 10px;color:#bad5f0}main{padding:18px;max-width:700px;margin:auto}.card{background:#112943;border:1px solid #244664;border-radius:18px;padding:18px;margin:0 0 13px}h2{font-size:21px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.muted{color:#a2b6cb;font-size:13px;line-height:1.6}button{cursor:pointer;background:#2562a5;border:0;color:white;border-radius:12px;padding:11px 14px;font-size:14px}button.secondary{background:#203c5a}input,textarea{width:100%;border:1px solid #41617d;border-radius:10px;background:#081e33;color:#fff;padding:11px;margin:7px 0;font:inherit}textarea{min-height:75px}nav{position:fixed;bottom:0;left:0;right:0;background:#10243b;border-top:1px solid #284a68;display:flex;overflow:auto;justify-content:space-around;padding:9px 4px env(safe-area-inset-bottom)}nav button{font-size:11px;background:none;padding:10px 7px;white-space:nowrap}nav button.active{background:#235083}.count{font-size:34px;font-weight:700}.item{border-top:1px solid #2b4862;padding:12px 0}.item:first-of-type{border-top:0}.small{font-size:12px}.notice{border-left:3px solid #6c9ee4;padding-left:12px}</style><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf4ff;background:#04111e}
body{background:#04111e;padding-bottom:90px}header{position:relative;padding:25px 20px 0;background:linear-gradient(180deg,rgba(2,13,26,.12),rgba(2,13,26,.88)),url('https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=1400&q=85') center/cover;min-height:460px}
header h1{font-weight:300;font-size:36px;letter-spacing:.28em;text-align:center}header p{text-align:center;letter-spacing:.2em;text-transform:uppercase;font-size:10px;margin-top:6px}header .tag{font-size:10px;background:#0618279c}
main{max-width:900px;padding:14px 15px}.card{background:linear-gradient(135deg,#10243a,#071726);border:1px solid #244464;border-radius:16px;box-shadow:0 10px 28px #0003}
nav{background:#04101df5;border-top:1px solid #19354f;gap:3px;padding-bottom:max(10px,env(safe-area-inset-bottom))}nav button{font-size:10px;flex:1;padding:9px 2px;min-width:0}nav button.active{color:#69adff;background:#0e3055}
.hero-copy{position:absolute;bottom:23px;left:22px;right:20px;text-shadow:0 2px 14px #000c}.hero-copy h2{font-size:clamp(38px,9vw,70px);font-weight:900;line-height:.98;letter-spacing:-.045em;margin:0 0 18px}.hero-copy h2 em{font-style:normal;color:#5da9ff}.hero-copy p{border-left:3px solid #4ba3ff;padding-left:13px;font-size:14px;line-height:1.45;text-align:left;letter-spacing:0;text-transform:none}
.today-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:10px}.today-grid .card{min-height:180px;position:relative;overflow:hidden}.photo-card{background:linear-gradient(0deg,#06111cf5,#06111c10),url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85') center/cover}.sea-card{background:linear-gradient(0deg,#06111c,#06111c25),url('https://images.unsplash.com/photo-1505142468610-359e7d316be0?auto=format&fit=crop&w=700&q=85') center/cover}.eyebrow{font-size:10px;letter-spacing:.12em;color:#d4e3f7;text-transform:uppercase}.big-time{font-size:48px;font-weight:750;line-height:1.1;margin:8px 0}.stat-line{font-size:11px;color:#d6e8fa;line-height:1.8}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.section-head h3{font-size:15px;letter-spacing:.04em;margin:0}.section-head span{font-size:12px;color:#4aa3ff}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{min-height:154px;border:1px solid #244464;border-radius:13px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px 7px;background-size:cover;background-position:center;cursor:pointer}.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06111ef5,transparent 90%)}.tile b{position:relative;font-size:11px;line-height:1.3}.quote-banner{margin:22px -15px;padding:30px 24px;background:linear-gradient(90deg,#04111dd9,#04111d38),url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85') center/cover;min-height:145px;display:flex;align-items:center;justify-content:flex-end}.quote-banner p{max-width:220px;font-size:16px;line-height:1.45}.event-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.event-grid .card{padding:12px 9px;min-height:92px;font-size:12px}.event-grid strong{display:block;margin:7px 0}.event-grid .muted{font-size:10px}
@media(max-width:390px){.today-grid{grid-template-columns:1.3fr 1fr}.big-time{font-size:39px}.tiles{gap:5px}.tile{min-height:132px;padding:7px 5px}.tile b{font-size:10px}}
</style></head>
<body><header><h1>ТРОПА</h1><p>Движение. Море. Разговоры. Люди.</p><span class="tag">ДЕМО · данные только на этом устройстве</span><div class="hero-copy"><h2>БОЛЬШЕ<br>ЧЕМ ПРОСТО<br><em>РАССВЕТ</em></h2><p>Не скорость определяет путь,<br>а решение идти.</p></div></header><main id="app"></main><nav id="nav"></nav>
<script>
const tabs=[['today','Сегодня'],['cold','Закаливание'],['run','Бег'],['media','Медиа'],['people','Люди'],['admin','Ведущий']];
const sample={cold:[],run:[],media:[],people:[],pending:[]};
let data;try{data=Object.assign({},sample,JSON.parse(localStorage.getItem('tropa_demo')||'{}'))}catch(e){data={...sample}}
let tab='today';const app=document.getElementById('app'),nav=document.getElementById('nav');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('tropa_demo',JSON.stringify(data));render()}
function add(kind,fields){const obj={date:new Date().toLocaleDateString('ru-RU')};for(const [k,id] of Object.entries(fields))obj[k]=document.getElementById(id).value.trim();if(!Object.values(obj).some(x=>x&&x!==obj.date))return;data[kind].unshift(obj);save()}
function items(kind,keys){return data[kind].length?data[kind].map((x,i)=>'<div class="item">'+keys.map(k=>'<div>'+esc(x[k])+'</div>').join('')+'<div class="muted">'+esc(x.date)+'</div></div>').join(''):'<p class="muted">Пока записей нет.</p>'}
function render(){nav.innerHTML=tabs.map(([id,name])=>'<button class="'+(id===tab?'active':'')+'" data-tab="'+id+'">'+name+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='today')app.innerHTML='<div class="today-grid"><div class="card photo-card"><div class="eyebrow">Доброе утро</div><div class="big-time">04:40</div><div class="eyebrow">Уже на тропе</div><p class="stat-line">♧ 10 км · утренняя прогулка<br>≋ Море после тропы</p></div><div class="card sea-card"><div class="eyebrow">Море</div><div class="big-time" style="font-size:31px">≋</div><p class="stat-line">Закаливание<br>Каждый день</p></div></div><div class="section-head"><h3>АКТИВНОСТЬ ГРУППЫ</h3><span>Разделы ›</span></div><div class="tiles"><div class="tile" data-go="today" style="background-image:url(https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=400&q=80)"><b>Утренняя<br>тропа</b></div><div class="tile" data-go="cold" style="background-image:url(https://images.unsplash.com/photo-1505142468610-359e7d316be0?auto=format&fit=crop&w=400&q=80)"><b>Закаливание</b></div><div class="tile" data-go="run" style="background-image:url(https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=400&q=80)"><b>Бег</b></div><div class="tile" data-go="media" style="background-image:url(https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=400&q=80)"><b>Фото и видео</b></div></div><div class="quote-banner"><p>❝ Каждый день — это выбор.<br>Именно он формирует жизнь.</p></div><div class="section-head"><h3>БЛИЖАЙШИЕ СОБЫТИЯ</h3><span>Скоро</span></div><div class="event-grid"><div class="card">☀<strong>Утренняя тропа</strong><span class="muted">Ежедневно 04:40</span></div><div class="card">≋<strong>Купание</strong><span class="muted">После тропы</span></div><div class="card">♧<strong>Встречи</strong><span class="muted">Добавим позже</span></div></div><div class="card notice" style="margin-top:16px"><p class="muted">Демонстрация: без общей базы и регистрации. Не вводите персональные данные.</p></div>';
if(tab==='cold')app.innerHTML='<div class="card"><h2>Закаливание</h2><p class="muted">Личный дневник на этом устройстве</p><input id="temp" placeholder="Температура воды, °C" inputmode="decimal"><textarea id="feel" placeholder="Как себя чувствую (без личных данных)"></textarea><button id="add">Сохранить запись</button></div><div class="card"><h3>История</h3>'+items('cold',['temp','feel'])+'</div>';
if(tab==='run')app.innerHTML='<div class="card"><h2>Бег</h2><input id="distance" placeholder="Дистанция, км" inputmode="decimal"><input id="time" placeholder="Время или результат"><button id="add">Добавить тренировку</button></div><div class="card"><h3>Мои записи</h3>'+items('run',['distance','time'])+'</div>';
if(tab==='media')app.innerHTML='<div class="card"><h2>Фото и видео</h2><div style="padding:16px 0;text-align:center"><button onclick="openCircle()" style="border-radius:100px;background:#307bd0;padding:16px 20px">◉ Записать кружочек</button><p class="muted">До 60 секунд · предпросмотр только на этом устройстве</p></div><p class="muted">Загрузка файлов появится после подключения защищённого хранилища. Сейчас можно создать демонстрационную заявку.</p><input id="caption" placeholder="Название публикации"><select id="type" style="padding:10px;background:#081e33;color:white;border-radius:9px"><option>Фото</option><option>Видео</option></select> <button id="add">Отправить на модерацию</button></div><div class="card"><h3>Одобренные записи</h3>'+items('media',['type','caption'])+'</div>';
if(tab==='people')app.innerHTML='<div class="card"><h2>Люди ТРОПЫ</h2><p class="muted">В реальном приложении участники появятся только после приглашения и согласия. Сейчас здесь нет настоящих профилей.</p></div>';
if(tab==='admin')app.innerHTML='<div class="card"><h2>Панель ведущего</h2><p class="muted">Демонстрация модерации. Это НЕ защищённая административная панель.</p><h3>Ожидают решения: '+data.pending.length+'</h3>'+data.pending.map((x,i)=>'<div class="item">'+esc(x.type)+' · '+esc(x.caption)+' <button data-ok="'+i+'">Одобрить</button> <button class="secondary" data-no="'+i+'">Отклонить</button></div>').join('')+'</div>';
const addBtn=document.getElementById('add');if(addBtn)addBtn.onclick=()=>{if(tab==='cold')add('cold',{temp:'temp',feel:'feel'});if(tab==='run')add('run',{distance:'distance',time:'time'});if(tab==='media')add('pending',{caption:'caption',type:'type'})};
app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{data.media.unshift(data.pending.splice(Number(b.dataset.ok),1)[0]);save()});app.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{data.pending.splice(Number(b.dataset.no),1);save()})}render();
</script><style>
#circleOverlay{position:fixed;inset:0;background:#06111ff5;z-index:999;display:none;overflow:auto;padding:20px;text-align:center}
#circleOverlay.show{display:block}
#circleOverlay video{width:min(76vw,330px);height:min(76vw,330px);border-radius:50%;object-fit:cover;background:#152c45;border:4px solid #3689df;display:block;margin:24px auto}
#circleOverlay .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#circleOverlay button{min-width:100px}
#circleOverlay .time{font-size:23px;font-variant-numeric:tabular-nums;color:#d8e9ff}
</style>
<div id="circleOverlay" role="dialog" aria-modal="true" aria-label="Запись видеокружочка">
<button style="float:right;background:#1c3b59" onclick="closeCircle()">Закрыть ×</button>
<h2 style="margin-top:55px">Видеокружочек</h2>
<p class="muted">Тестовая запись · видео не загружается на сервер</p>
<video id="circleVideo" playsinline muted autoplay></video>
<div class="time" id="circleTimer">00:00 / 01:00</div>
<p id="circleStatus" class="muted">Разреши доступ к камере и микрофону</p>
<div class="controls">
<button id="circleStart" onclick="startCircle()" disabled>● Запись</button>
<button id="circleStop" onclick="stopCircle()" disabled>■ Стоп</button>
<button id="circleFlip" onclick="flipCircle()">↻ Камера</button>
<button id="circleDownload" onclick="downloadCircle()" style="display:none">Сохранить видео</button>
</div>
</div>
<script>
let circleStream=null,circleRecorder=null,circleParts=[],circleUrl=null,circleFacing='user',circleTick=null,circleStarted=0,circleMime='';
const cv=document.getElementById('circleVideo'),co=document.getElementById('circleOverlay');
function circleMsg(msg){document.getElementById('circleStatus').textContent=msg}
function circleButtons(recording){document.getElementById('circleStart').disabled=recording||!circleStream;document.getElementById('circleStop').disabled=!recording;document.getElementById('circleFlip').disabled=recording}
async function openCircle(){co.classList.add('show');await cameraCircle()}
async function cameraCircle(){
if(circleStream)circleStream.getTracks().forEach(t=>t.stop());
if(circleUrl){URL.revokeObjectURL(circleUrl);circleUrl=null}
document.getElementById('circleDownload').style.display='none';
try{
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Запись не поддерживается этим браузером. Открой приложение в Safari на iPhone.');
circleStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:circleFacing},width:{ideal:720},height:{ideal:720}},audio:true});
cv.srcObject=circleStream;cv.muted=true;cv.controls=false;await cv.play();circleButtons(false);circleMsg('Готово к записи · максимум 60 секунд');
}catch(e){circleMsg('Не удалось открыть камеру: '+e.message);circleButtons(false)}
}
async function flipCircle(){if(circleRecorder?.state==='recording')return;circleFacing=circleFacing==='user'?'environment':'user';await cameraCircle()}
function startCircle(){
if(!circleStream||circleRecorder?.state==='recording')return;
try{
circleParts=[];circleMime=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
circleRecorder=new MediaRecorder(circleStream,circleMime?{mimeType:circleMime}:undefined);
circleRecorder.ondataavailable=e=>{if(e.data.size)circleParts.push(e.data)};
circleRecorder.onstop=()=>{
clearInterval(circleTick);
const blob=new Blob(circleParts,{type:circleRecorder.mimeType||'video/mp4'});
if(!blob.size){circleMsg('Запись не получилась. Попробуй ещё раз.');return}
circleUrl=URL.createObjectURL(blob);cv.srcObject=null;cv.src=circleUrl;cv.muted=false;cv.controls=true;cv.loop=true;cv.play().catch(()=>{});circleStream?.getTracks().forEach(t=>t.stop());circleStream=null;
document.getElementById('circleDownload').style.display='inline-block';circleButtons(false);circleMsg('Предпросмотр готов. Видео пока только на этом устройстве.');
};
circleRecorder.onerror=()=>circleMsg('Ошибка записи. Попробуй ещё раз.');
circleRecorder.start(1000);circleStarted=Date.now();circleButtons(true);
circleTick=setInterval(()=>{const secs=Math.min(60,Math.floor((Date.now()-circleStarted)/1000));document.getElementById('circleTimer').textContent='00:'+String(secs).padStart(2,'0')+' / 01:00';if(secs>=60)stopCircle()},250);
circleMsg('Идёт запись…');
}catch(e){circleMsg('Не удалось начать запись: '+e.message)}
}
function stopCircle(){if(circleRecorder?.state==='recording')circleRecorder.stop();clearInterval(circleTick)}
function downloadCircle(){if(!circleUrl)return;const a=document.createElement('a');a.href=circleUrl;a.download='tropa-circle.'+(circleMime.includes('webm')?'webm':'mp4');document.body.appendChild(a);a.click();a.remove()}
function closeCircle(){stopCircle();circleStream?.getTracks().forEach(t=>t.stop());circleStream=null;cv.pause();cv.srcObject=null;cv.removeAttribute('src');cv.load();if(circleUrl){URL.revokeObjectURL(circleUrl);circleUrl=null}co.classList.remove('show');document.getElementById('circleTimer').textContent='00:00 / 01:00';document.getElementById('circleDownload').style.display='none'}
</script></body></html>
