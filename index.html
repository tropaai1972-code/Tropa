<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102f59"><title>ТРОПА — сообщество</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f1fa;background:#07182c}*{box-sizing:border-box}body{margin:0;padding:0 0 85px}header{padding:25px 20px;background:linear-gradient(135deg,#102f59,#07182c)}h1{font-size:29px;letter-spacing:.18em;margin:0}header p{opacity:.7;font-size:13px}.tag{display:inline-block;font-size:11px;border:1px solid #6586aa;border-radius:99px;padding:5px 10px;color:#bad5f0}main{padding:18px;max-width:700px;margin:auto}.card{background:#112943;border:1px solid #244664;border-radius:18px;padding:18px;margin:0 0 13px}h2{font-size:21px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.muted{color:#a2b6cb;font-size:13px;line-height:1.6}button{cursor:pointer;background:#2562a5;border:0;color:white;border-radius:12px;padding:11px 14px;font-size:14px}button.secondary{background:#203c5a}input,textarea{width:100%;border:1px solid #41617d;border-radius:10px;background:#081e33;color:#fff;padding:11px;margin:7px 0;font:inherit}textarea{min-height:75px}nav{position:fixed;bottom:0;left:0;right:0;background:#10243b;border-top:1px solid #284a68;display:flex;overflow:auto;justify-content:space-around;padding:9px 4px env(safe-area-inset-bottom)}nav button{font-size:11px;background:none;padding:10px 7px;white-space:nowrap}nav button.active{background:#235083}.count{font-size:34px;font-weight:700}.item{border-top:1px solid #2b4862;padding:12px 0}.item:first-of-type{border-top:0}.small{font-size:12px}.notice{border-left:3px solid #6c9ee4;padding-left:12px}</style></head>
<body><header><h1>ТРОПА</h1><p>Движение. Море. Разговоры. Люди.</p><span class="tag">ДЕМО · данные только на этом устройстве</span></header><main id="app"></main><nav id="nav"></nav>
<script>
const tabs=[['today','Сегодня'],['cold','Закаливание'],['run','Бег'],['media','Медиа'],['people','Люди'],['admin','Ведущий']];
const sample={cold:[],run:[],media:[],people:[],pending:[]};
let data;try{data=Object.assign({},sample,JSON.parse(localStorage.getItem('tropa_demo')||'{}'))}catch(e){data={...sample}}
let tab='today';const app=document.getElementById('app'),nav=document.getElementById('nav');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('tropa_demo',JSON.stringify(data));render()}
function add(kind,fields){const obj={date:new Date().toLocaleDateString('ru-RU')};for(const [k,id] of Object.entries(fields))obj[k]=document.getElementById(id).value.trim();if(!Object.values(obj).some(x=>x&&x!==obj.date))return;data[kind].unshift(obj);save()}
function items(kind,keys){return data[kind].length?data[kind].map((x,i)=>'<div class="item">'+keys.map(k=>'<div>'+esc(x[k])+'</div>').join('')+'<div class="muted">'+esc(x.date)+'</div></div>').join(''):'<p class="muted">Пока записей нет.</p>'}
function render(){nav.innerHTML=tabs.map(([id,name])=>'<button class="'+(id===tab?'active':'')+'" data-tab="'+id+'">'+name+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='today')app.innerHTML='<div class="card"><h2>Доброе утро</h2><div class="count">04:40</div><p class="muted">Каждый день. 10 километров. После прогулки — море.</p></div><div class="card"><h3>Сегодня на ТРОПЕ</h3><p>Не скорость определяет путь, а решение идти.</p></div><div class="card notice"><h3>Тестовая версия</h3><p class="muted">Это открытая демонстрация без входа и общей базы. Не вводите настоящие имена, даты рождения или медицинские сведения.</p></div>';
if(tab==='cold')app.innerHTML='<div class="card"><h2>Закаливание</h2><p class="muted">Личный дневник на этом устройстве</p><input id="temp" placeholder="Температура воды, °C" inputmode="decimal"><textarea id="feel" placeholder="Как себя чувствую (без личных данных)"></textarea><button id="add">Сохранить запись</button></div><div class="card"><h3>История</h3>'+items('cold',['temp','feel'])+'</div>';
if(tab==='run')app.innerHTML='<div class="card"><h2>Бег</h2><input id="distance" placeholder="Дистанция, км" inputmode="decimal"><input id="time" placeholder="Время или результат"><button id="add">Добавить тренировку</button></div><div class="card"><h3>Мои записи</h3>'+items('run',['distance','time'])+'</div>';
if(tab==='media')app.innerHTML='<div class="card"><h2>Фото и видео</h2><p class="muted">Загрузка файлов появится после подключения защищённого хранилища. Сейчас можно создать демонстрационную заявку.</p><input id="caption" placeholder="Название публикации"><select id="type" style="padding:10px;background:#081e33;color:white;border-radius:9px"><option>Фото</option><option>Видео</option></select> <button id="add">Отправить на модерацию</button></div><div class="card"><h3>Одобренные записи</h3>'+items('media',['type','caption'])+'</div>';
if(tab==='people')app.innerHTML='<div class="card"><h2>Люди ТРОПЫ</h2><p class="muted">В реальном приложении участники появятся только после приглашения и согласия. Сейчас здесь нет настоящих профилей.</p></div>';
if(tab==='admin')app.innerHTML='<div class="card"><h2>Панель ведущего</h2><p class="muted">Демонстрация модерации. Это НЕ защищённая административная панель.</p><h3>Ожидают решения: '+data.pending.length+'</h3>'+data.pending.map((x,i)=>'<div class="item">'+esc(x.type)+' · '+esc(x.caption)+' <button data-ok="'+i+'">Одобрить</button> <button class="secondary" data-no="'+i+'">Отклонить</button></div>').join('')+'</div>';
const addBtn=document.getElementById('add');if(addBtn)addBtn.onclick=()=>{if(tab==='cold')add('cold',{temp:'temp',feel:'feel'});if(tab==='run')add('run',{distance:'distance',time:'time'});if(tab==='media')add('pending',{caption:'caption',type:'type'})};
app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{data.media.unshift(data.pending.splice(Number(b.dataset.ok),1)[0]);save()});app.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{data.pending.splice(Number(b.dataset.no),1);save()})}render();
</script></body></html>
